<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarot Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <select id="language-select" aria-label="Language">
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
    <button id="reset-button">Reset</button>
  </header>

  <main>
    <h1 id="app-title">Tarot Web</h1>
    <p id="app-subtitle" class="subtitle">For entertainment purposes only.</p>

    <div class="spread-row">
      <label for="spread-select" id="spread-select-label" class="spread-label">Spread</label>
      <select id="spread-select">
        <option value="single">Single Card</option>
        <option value="three">Three-Card (Past / Present / Future)</option>
        <option value="celtic">Celtic Cross</option>
      </select>
      <button id="draw-button">Draw</button>
    </div>

    <canvas id="trail-canvas" class="trail-canvas" hidden aria-hidden="true"></canvas>
    <section id="card-view" class="card-view" hidden></section>
    <button id="save-reading-button" class="save-button" hidden>Save reading</button>
  </main>

  <div id="card-modal" class="card-modal" hidden>
    <div class="card-modal-backdrop" data-close></div>
    <div class="card-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="card-modal-name">
      <button id="card-modal-close" class="card-modal-close" aria-label="Close">&times;</button>
      <img id="card-modal-image" class="card-modal-image" alt="" />
      <div class="card-modal-text">
        <p id="card-modal-position" class="card-modal-position"></p>
        <p id="card-modal-position-desc" class="card-modal-position-desc"></p>
        <h2 id="card-modal-name"></h2>
        <p id="card-modal-orientation" class="card-modal-orientation"></p>
        <p id="card-modal-meaning" class="card-modal-meaning"></p>
        <button id="card-modal-save" class="save-button">Save card</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
