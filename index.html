<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarot Web</title>
  <link rel="icon" type="image/png" href="images/Favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="starfield-canvas" class="starfield" aria-hidden="true"></canvas>
  <header class="top-bar">
    <div class="top-bar-brand">
      <canvas id="crystal-ball-canvas" class="crystal-ball" aria-hidden="true"></canvas>
      <div class="top-bar-titles">
        <h1 id="app-title">Tarot Web</h1>
        <p id="app-subtitle" class="subtitle">For entertainment purposes only.</p>
      </div>
    </div>
    <div class="top-bar-controls">
      <select id="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
      </select>
      <button id="reset-button">Reset</button>
    </div>
  </header>

  <main>
    <div class="spread-row">
      <div id="spread-options" class="spread-options" role="group" aria-label="Spread">
        <button type="button" class="spread-option is-selected" data-spread="single">Single Card</button>
        <button type="button" class="spread-option" data-spread="three">Three-Card</button>
        <button type="button" class="spread-option" data-spread="celtic">Celtic Cross</button>
      </div>
    </div>

    <canvas id="trail-canvas" class="trail-canvas" hidden aria-hidden="true"></canvas>
    <section id="card-view" class="card-view" hidden></section>
    <button id="save-reading-button" class="save-button" hidden>Save reading</button>
  </main>

  <footer class="site-footer">
    <p class="site-footer-credit">&copy; <span id="footer-year"></span> zafrem &mdash; Interpretation is up to you</p>
    <a href="https://buymeacoffee.com/zafrem" target="_blank" rel="noopener noreferrer">
      <img src="https://img.shields.io/badge/Buy%20Me%20a%20Coffee-ffdd00?style=for-the-badge&logo=buy-me-a-coffee&logoColor=black" alt="Buy Me a Coffee" />
    </a>
  </footer>

  <div id="card-modal" class="card-modal" hidden>
    <div class="card-modal-backdrop" data-close></div>
    <div class="card-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="card-modal-name">
      <button id="card-modal-close" class="card-modal-close" aria-label="Close">&times;</button>
      <img id="card-modal-image" class="card-modal-image" alt="" />
      <div class="card-modal-text">
        <p id="card-modal-position" class="card-modal-position"></p>
        <p id="card-modal-position-desc" class="card-modal-position-desc"></p>
        <h2 id="card-modal-name"></h2>
        <p id="card-modal-orientation" class="card-modal-orientation"></p>
        <p id="card-modal-meaning" class="card-modal-meaning"></p>
        <button id="card-modal-save" class="save-button">Save card</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
