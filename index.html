<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarot Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <select id="language-select" aria-label="Language">
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
    </select>
    <button id="reset-button">Reset</button>
  </header>

  <main>
    <h1 id="app-title">Tarot Web</h1>
    <p id="app-subtitle" class="subtitle">For entertainment purposes only.</p>

    <label for="spread-select" id="spread-select-label" class="spread-label">Spread</label>
    <select id="spread-select">
      <option value="single">Single Card</option>
      <option value="three">Three-Card (Past / Present / Future)</option>
      <option value="celtic">Celtic Cross</option>
    </select>

    <section id="card-view" class="card-view" hidden></section>

    <button id="draw-button">Draw</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
