<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarot Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>🔮 Tarot Web</h1>
    <p class="subtitle">For entertainment purposes only.</p>

    <label for="spread-select" class="spread-label">Spread</label>
    <select id="spread-select">
      <option value="single">Single Card</option>
      <option value="three">Three-Card (Past / Present / Future)</option>
      <option value="celtic">Celtic Cross</option>
    </select>

    <section id="card-view" class="card-view" hidden></section>

    <button id="draw-button">Draw</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
